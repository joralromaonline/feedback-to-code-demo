name: Validate feedback change

on:
  pull_request:
    branches: [demo-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
