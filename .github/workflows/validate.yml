name: Validate feedback change

on:
  pull_request:
    branches: [demo-base]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  invalidate-stale-approval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Invalidate approvals for older commits
        uses: actions/github-script@v9
        with:
          script: |
            const pull = context.payload.pull_request;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: pull.number,
              per_page: 100
            });
            const staleApprovals = reviews.filter((review) =>
              review.user?.login === "github-actions[bot]" &&
              review.state === "APPROVED" &&
              review.commit_id !== pull.head.sha
            );
            for (const review of staleApprovals) {
              await github.rest.pulls.dismissReview({
                ...context.repo,
                pull_number: pull.number,
                review_id: review.id,
                message: "A new commit requires all validations to pass again."
              });
            }

  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  approve:
    name: Approve validated feedback PR
    needs: [invalidate-stale-approval, validate]
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        needs.invalidate-stale-approval.result == 'success' &&
        needs.validate.result == 'success' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'demo-base' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'feedback/') &&
        github.event.pull_request.user.login == 'feedback-to-code-joralromaonline[bot]'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Verify scope and approve current commit
        uses: actions/github-script@v9
        with:
          script: |
            const eventPull = context.payload.pull_request;
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: eventPull.number
            });
            if (pull.state !== "open" || pull.draft || pull.head.sha !== eventPull.head.sha) {
              core.setFailed("The pull request changed after validation; approval was stopped.");
              return;
            }

            const allowedFiles = new Set([
              "index.html",
              "src/product.js",
              "src/product.css",
              "src/product.test.js",
              "src/feedback-sdk.js",
              "validation-report.json"
            ]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pull.number,
              per_page: 100
            });
            const unexpected = files.map((file) => file.filename).filter((file) => !allowedFiles.has(file));
            if (unexpected.length) {
              core.setFailed(`Automatic approval blocked by out-of-scope files: ${unexpected.join(", ")}`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo,
              pull_number: pull.number,
              per_page: 100
            });
            const alreadyApproved = reviews.some((review) =>
              review.user?.login === "github-actions[bot]" &&
              review.state === "APPROVED" &&
              review.commit_id === pull.head.sha
            );
            if (alreadyApproved) {
              core.notice(`Commit ${pull.head.sha} is already approved.`);
              return;
            }

            await github.rest.pulls.createReview({
              ...context.repo,
              pull_number: pull.number,
              commit_id: pull.head.sha,
              event: "APPROVE",
              body: "Automatically approved: test, lint, typecheck and build passed for this commit, and all changed files are inside the product allowlist."
            });

  deploy-approved-preview:
    name: Deploy approved PR preview
    needs: approve
    if: ${{ needs.approve.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: feedback-approved-pages-preview
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout the exact approved commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy approved preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
