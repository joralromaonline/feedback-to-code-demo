name: Deploy demo to GitHub Pages

on:
  push:
    branches: [demo-base]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  finalize-feedback:
    name: Close deployed feedback issue
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Close Issues linked by the deployed PR
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha, per_page: 100 }
            );
            const deliveredPullRequests = pullRequests.filter((pull) =>
              pull.merged_at && pull.base.ref === "demo-base"
            );
            const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const issueNumbers = new Set();
            for (const pull of deliveredPullRequests) {
              for (const match of (pull.body || "").matchAll(closingPattern)) {
                issueNumbers.add(Number(match[1]));
              }
            }

            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                ...context.repo,
                issue_number: issueNumber
              });
              if (issue.pull_request || issue.state !== "open") continue;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: "feedback:status:deployed",
                  color: "0e8a16",
                  description: "Feedback merged and deployed successfully"
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
              const statusLabels = issue.labels
                .map((label) => typeof label === "string" ? label : label.name)
                .filter((label) => label?.startsWith("feedback:status:"));
              for (const label of statusLabels) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issueNumber,
                  name: label
                });
              }
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: issueNumber,
                labels: ["feedback:status:deployed"]
              });
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: `✅ Cambio desplegado correctamente en GitHub Pages desde el commit ${context.sha.slice(0, 7)}.`
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issueNumber,
                state: "closed",
                state_reason: "completed"
              });
            }
